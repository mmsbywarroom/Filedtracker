apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def mapsApiKey = ""
def localProps = rootProject.file("local.properties")
if (localProps.exists()) {
    def props = new Properties()
    localProps.withInputStream { props.load(it) }
    mapsApiKey = props.getProperty("MAPS_API_KEY", "")
}
if (!mapsApiKey) {
    mapsApiKey = System.getenv("MAPS_API_KEY") ?: ""
}

android {
    namespace "in.videh.filedtracker.nativeapp"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "in.videh.filedtracker.native"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "1.2.3"
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "com.google.android.material:material:$materialVersion"
    implementation "androidx.core:core-ktx:$coreKtxVersion"
    implementation "com.google.android.gms:play-services-location:$playServicesLocationVersion"
    implementation "com.google.android.gms:play-services-auth-api-phone:18.1.0"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"

    implementation "androidx.activity:activity-compose:$activityComposeVersion"
    implementation "androidx.navigation:navigation-compose:$navigationComposeVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycleVersion"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "com.google.maps.android:maps-compose:$mapsComposeVersion"
    implementation "com.google.android.gms:play-services-maps:$playServicesMapsVersion"

    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    // Play Services delivers the model — keeps APK much smaller than bundled ML Kit.
    implementation "com.google.android.gms:play-services-mlkit-face-detection:$mlkitFaceVersion"
}
