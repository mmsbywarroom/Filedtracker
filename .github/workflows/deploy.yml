name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t filedtracker:latest .

      - name: Pack image
        run: docker save filedtracker:latest | gzip > filedtracker.tar.gz

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "filedtracker.tar.gz,docker-compose.prod.yml,deploy/nginx.conf"
          target: /opt/filedtracker
          overwrite: true

      - name: Load image and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/filedtracker
            if [ ! -f .env ]; then
              echo "Create /opt/filedtracker/.env on the server first (see DEPLOY.md)"
              exit 1
            fi
            gzip -dc filedtracker.tar.gz | docker load
            docker compose -f docker-compose.prod.yml up -d
            rm -f filedtracker.tar.gz
            docker compose -f docker-compose.prod.yml ps
