# HTTP → HTTPS redirect
server {
    listen 80;
    server_name filed.videh.co.in;
    return 301 https://$host$request_uri;
}

# HTTPS (certbot: sudo certbot --nginx -d filed.videh.co.in)
server {
    listen 443 ssl http2;
    server_name filed.videh.co.in;

    ssl_certificate /etc/letsencrypt/live/filed.videh.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filed.videh.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 80m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
