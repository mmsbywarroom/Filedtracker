# Rate limits — face/punch flood was freezing the 1GB Node process.
limit_req_zone $binary_remote_addr zone=ft_face:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=ft_api:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=ft_conn:10m;

upstream filedtracker_app {
    server 127.0.0.1:3000;
    keepalive 8;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name filed.videh.co.in;
    return 301 https://$host$request_uri;
}

# HTTPS (certbot: sudo certbot --nginx -d filed.videh.co.in)
server {
    listen 443 ssl http2;
    server_name filed.videh.co.in;

    ssl_certificate /etc/letsencrypt/live/filed.videh.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filed.videh.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 80m;
    limit_conn ft_conn 20;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cheap public endpoints — keep site/app update check alive under load
    location = /api/app/version {
        proxy_pass http://filedtracker_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Heavy face CPU — strict limit so OTP/home keep working
    location /api/face/ {
        limit_req zone=ft_face burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://filedtracker_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    location /api/attendance {
        limit_req zone=ft_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://filedtracker_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/auth/ {
        limit_req zone=ft_api burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://filedtracker_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=ft_api burst=30 nodelay;
        proxy_pass http://filedtracker_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
