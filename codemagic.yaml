# Native iOS → TestFlight (not React Native)
# Bundle: in.videh.filedtracker.aap | Team: 33AW34RHHQ
#
# Codemagic → Application settings → Environment variables:
#   Variable name: CERTIFICATE_PRIVATE_KEY
#   Group: code-signing  (create if missing)
#   Secret: ON
#   Value: full PEM from ios-native/signing/cert_key.pem (BEGIN/END lines included)
# App Store Connect integration name must be: Codemagic

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - code-signing
      vars:
        XCODE_PROJECT: "ios-native/AAPAttendance.xcodeproj"
        XCODE_SCHEME: "AAPAttendance"
        BUNDLE_ID: "in.videh.filedtracker.aap"
      xcode: latest
    scripts:
      - name: Init keychain + create/fetch App Store signing
        script: |
          set -e
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Missing CERTIFICATE_PRIVATE_KEY."
            echo "Codemagic → Environment variables → add secret CERTIFICATE_PRIVATE_KEY in group code-signing"
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA for App Store / TestFlight
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
