# Native iOS → TestFlight (not React Native)
# Bundle: in.videh.filedtracker.aap | Team: 33AW34RHHQ

workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Settings → Developer Portal key name
      app_store_connect: Codemagic
    environment:
      vars:
        XCODE_PROJECT: "ios-native/AAPAttendance.xcodeproj"
        XCODE_SCHEME: "AAPAttendance"
        BUNDLE_ID: "in.videh.filedtracker.aap"
      xcode: latest
    scripts:
      - name: Init keychain + create/fetch App Store signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA for App Store / TestFlight
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
