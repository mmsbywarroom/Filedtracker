services:
  app:
    image: filedtracker:latest
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Docker sets HOSTNAME=container-id; Next.js then binds only there and nginx/wget hang.
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NODE_OPTIONS: --dns-result-order=ipv4first
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    ports:
      - "3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
